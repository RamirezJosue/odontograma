<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      <h:outputStylesheet library="css" name="odontograma.css" />
      

<h:head>
    <title>Odontograma</title>
</h:head>

<h:body>



    <!-- TOOLBAR SUPERIOR -->
   	<ui:include src="/view/odontograma/components/toolbar-superior.xhtml"/>
   	

    <div class="layout-odontograma">

        <!-- BARRA LATERAL IZQUIERDA -->
      	<!-- <ui:include src="components/barra-lateral.xhtml"/> -->

      <p:panel header="DATOS DEL PACIENTE" styleClass="panel-paciente">
        <p:panelGrid columns="4" layout="grid" styleClass="ui-fluid">

            <p:outputLabel value="Apellidos y Nombres:" />
            <p:inputText value="#{odontogramaBean.paciente.apellidosNombres}" style="width:100%" />

            <p:outputLabel value="Documento de Identidad:" />
            <p:inputText value="#{odontogramaBean.paciente.documento}" style="width:100%" />

            <p:outputLabel value="Fecha de Nacimiento:" />
            <p:calendar value="#{odontogramaBean.paciente.fechaNacimiento}" pattern="dd/MM/yyyy" style="width:100%" />

            <p:outputLabel value="Género:" />
            <p:selectOneMenu value="#{odontogramaBean.paciente.genero}" style="width:100%">
                <f:selectItem itemLabel="Seleccione" itemValue="" />
                <f:selectItem itemLabel="Masculino" itemValue="Masculino" />
                <f:selectItem itemLabel="Femenino" itemValue="Femenino" />
                <f:selectItem itemLabel="Otro" itemValue="Otro" />
            </p:selectOneMenu>

            <p:outputLabel value="Correo Electrónico:" />
            <p:inputText value="#{odontogramaBean.paciente.correo}" style="width:100%" />

            <p:outputLabel value="Celular Paciente:" />
            <p:inputText value="#{odontogramaBean.paciente.celular}" style="width:100%" />

            <p:outputLabel value="Sucursal de Registro:" />
            <p:inputText value="#{odontogramaBean.paciente.sucursal}" style="width:100%" />

            <p:outputLabel value="Fecha de Admisión:" />
            <p:calendar value="#{odontogramaBean.paciente.fechaAdmision}" pattern="dd/MM/yyyy" style="width:100%" />

        </p:panelGrid>

        <p:commandButton value="Guardar Datos del Paciente" 
                        action="#{odontogramaBean.guardarPaciente}"
                        icon="pi pi-save"
                        style="margin-top:10px" />
    </p:panel>


        <!-- CONTENIDO CENTRAL -->
        <div class="contenido-central">

            <p:tabView id="tabsOdontograma">
                
                <p:tab title="Consulta Odontológica">
                    <ui:include src="/view/odontograma/tabs/inicial.xhtml"/>
                </p:tab>

                <p:tab title="Odontograma Evolución">
                    <ui:include src="/view/odontograma/tabs/evolucion.xhtml"/>
                </p:tab>

                <p:tab title="Alta Odontológica">
                    <ui:include src="/view/odontograma/tabs/historial.xhtml"/>
                </p:tab>

            </p:tabView>

        </div>

    </div>



<!-- DRAWERS / DIALOGS -->
<ui:include src="/view/odontograma/dialogs/presupuesto.xhtml"/>
<ui:include src="/view/odontograma/dialogs/cobros.xhtml"/>
<h:outputScript library="js" name="odontograma.js" target="body" />

</h:body>
</html>
