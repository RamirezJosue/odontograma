<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

<h:outputStylesheet>
    .receta-controles { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .receta-botones   { display:flex; justify-content:center; gap:20px; margin-top:1.5rem; }
</h:outputStylesheet>

<p:fieldset legend="Diagnóstico del Paciente" style="margin-bottom:1rem;">
    <p:dataTable value="#{recetaOdontologicoBean.diagnosticos}"
                 var="d"
                 rowIndexVar="rowIndex"
                 styleClass="registro-hallazgos-table"
                 emptyMessage="No hay diagnósticos registrados.">

        <p:column headerText="N#" width="50">
            <h:outputText value="#{rowIndex + 1}"
                          style="color:#2E6E9E; font-weight:bold;" />
        </p:column>

        <p:column headerText="CIE-10" width="90">
            <h:outputText value="#{d.cie10}" />
        </p:column>

        <p:column headerText="Diagnóstico">
            <h:outputText value="#{d.descripcion}" />
        </p:column>

        <p:column headerText="Detalle">
            <h:outputText value="#{d.detalle}" />
        </p:column>

    </p:dataTable>
</p:fieldset>

<!-- ===== MEDICAMENTOS ===== -->
<p:fieldset legend="Medicamentos" style="margin-bottom:1rem;">
    <h:form id="formReceta">

        <!-- Controles superiores -->
        <div class="receta-controles">
            <p:selectOneMenu id="medicamentoCombo"
                             value="#{recetaOdontologicoBean.medicamentoSeleccionado}"
                             style="width:220px;">
                <f:selectItem itemLabel="Seleccione un medicamento" itemValue="" noSelectionOption="true" />
                <f:selectItems value="#{recetaOdontologicoBean.medicamentosDisponibles}"
                               var="m" itemLabel="#{m}" itemValue="#{m}" />
                <p:ajax event="change"
                        listener="#{recetaOdontologicoBean.agregarMedicamento}"
                        process="medicamentoCombo"
                        update="tablaReceta" />
            </p:selectOneMenu>

            <div style="margin-left:auto; display:flex; gap:10px;">
                <p:commandButton value="Otro Medicamento"
                                 icon="pi pi-plus"
                                 action="#{recetaOdontologicoBean.agregarOtroMedicamento}"
                                 update="tablaReceta"
                                 process="@this"
                                 styleClass="p-button-outlined" />

                <p:commandButton value="Seleccionar Plantilla"
                                 icon="pi pi-list"
                                 type="button"
                                 styleClass="p-button-outlined" />
            </div>
        </div>

        <!-- Tabla de medicamentos -->
        <p:dataTable id="tablaReceta"
                     value="#{recetaOdontologicoBean.recetas}"
                     var="r"
                     rowIndexVar="rowIndex"
                     styleClass="registro-hallazgos-table"
                     editable="true"
                     editMode="row"
                     emptyMessage="No hay medicamentos agregados.">

            <p:ajax event="rowEdit"
                    update="tablaReceta"
                    listener="#{recetaOdontologicoBean.registrarReceta}" />
            <p:ajax event="rowEditCancel" update="tablaReceta" />

            <p:column headerText="N#" width="45">
                <h:outputText value="#{rowIndex + 1}"
                              style="color:#2E6E9E; font-weight:bold;" />
            </p:column>

            <p:column headerText="Medicamento">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{r.medicamento}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{r.medicamento}" style="width:100%" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="FF" width="70">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{r.ff}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:selectOneMenu value="#{r.ff}" style="width:100%">
                            <f:selectItem itemLabel="TAB" itemValue="TAB" />
                            <f:selectItem itemLabel="CAP" itemValue="CAP" />
                            <f:selectItem itemLabel="JBE" itemValue="JBE" />
                            <f:selectItem itemLabel="SOL" itemValue="SOL" />
                            <f:selectItem itemLabel="AMP" itemValue="AMP" />
                        </p:selectOneMenu>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Cantidad" width="90" style="text-align:center;">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{r.cantidad}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{r.cantidad}" style="width:60px;" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Duración (D)" width="110" style="text-align:center;">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{r.duracion}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{r.duracion}" style="width:60px;" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Indicaciones">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{r.indicaciones}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{r.indicaciones}" style="width:100%" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Editar" width="60" style="text-align:center;">
                <p:rowEditor />
            </p:column>

            <p:column headerText="Eliminar" width="70" style="text-align:center;">
                <p:commandButton icon="ui-icon-trash"
                                 styleClass="ui-button-danger ui-button-flat"
                                 title="Eliminar"
                                 process="@this"
                                 update="tablaReceta"
                                 action="#{recetaOdontologicoBean.eliminarReceta(r)}" />
            </p:column>

        </p:dataTable>

    </h:form>
</p:fieldset>

<!-- ===== BOTONES ===== -->
<h:form styleClass="receta-botones">
    <p:commandButton value="Registrar Receta"
                     icon="pi pi-save"
                     action="#{recetaOdontologicoBean.registrarReceta}" />
    <p:commandButton value="Salir de Atención"
                     icon="pi pi-sign-out"
                     type="button"
                     styleClass="p-button-secondary" />
</h:form>

</ui:composition>
