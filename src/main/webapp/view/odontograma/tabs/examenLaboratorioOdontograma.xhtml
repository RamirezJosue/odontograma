<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:p="http://primefaces.org/ui">

<h:outputStylesheet>
    .examen-controles { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
    .examen-botones   { display:flex; justify-content:center; gap:20px; margin-top:1.5rem; }
</h:outputStylesheet>

<!-- ===== DIAGNÓSTICO DEL PACIENTE (solo lectura) ===== -->
<p:fieldset legend="Diagnóstico del Paciente" style="margin-bottom:1rem;">
    <p:dataTable value="#{examenLaboratorioBean.diagnosticos}"
                 var="d"
                 rowIndexVar="rowIndex"
                 styleClass="registro-hallazgos-table"
                 emptyMessage="No hay diagnósticos registrados.">

        <p:column headerText="N#" width="50">
            <h:outputText value="#{rowIndex + 1}"
                          style="color:#2E6E9E; font-weight:bold;" />
        </p:column>

        <p:column headerText="CIE-10" width="90">
            <h:outputText value="#{d.cie10}" />
        </p:column>

        <p:column headerText="Diagnóstico">
            <h:outputText value="#{d.descripcion}" />
        </p:column>

        <p:column headerText="Detalle">
            <h:outputText value="#{d.detalle}" />
        </p:column>

    </p:dataTable>
</p:fieldset>

<!-- ===== EXÁMENES DE LABORATORIO ===== -->
<p:fieldset legend="Exámenes de Laboratorio" style="margin-bottom:1rem;">
    <h:form id="formExamen">

        <!-- Controles superiores -->
        <div class="examen-controles">
            <p:selectOneMenu id="examenCombo"
                             value="#{examenLaboratorioBean.examenSeleccionado}"
                             style="width:240px;">
                <f:selectItem itemLabel="Seleccione Exam. Laboratorio" itemValue="" noSelectionOption="true" />
                <f:selectItems value="#{examenLaboratorioBean.examenesDisponibles}"
                               var="e" itemLabel="#{e}" itemValue="#{e}" />
                <p:ajax event="change"
                        listener="#{examenLaboratorioBean.agregarExamen}"
                        process="examenCombo"
                        update="tablaExamen" />
            </p:selectOneMenu>

            <div style="margin-left:auto; display:flex; gap:10px;">
                <p:commandButton value="Otro Exam. Laboratorio"
                                 icon="pi pi-plus"
                                 action="#{examenLaboratorioBean.agregarOtroExamen}"
                                 update="tablaExamen"
                                 process="@this"
                                 styleClass="p-button-outlined" />

                <p:commandButton value="Seleccionar Plantilla"
                                 icon="pi pi-list"
                                 type="button"
                                 styleClass="p-button-outlined" />
            </div>
        </div>

        <!-- Tabla de exámenes -->
        <p:dataTable id="tablaExamen"
                     value="#{examenLaboratorioBean.examenes}"
                     var="ex"
                     rowIndexVar="rowIndex"
                     styleClass="registro-hallazgos-table"
                     editable="true"
                     editMode="row"
                     emptyMessage="No hay exámenes agregados.">

            <p:ajax event="rowEdit"       update="tablaExamen" />
            <p:ajax event="rowEditCancel" update="tablaExamen" />

            <p:column headerText="N#" width="45">
                <h:outputText value="#{rowIndex + 1}"
                              style="color:#2E6E9E; font-weight:bold;" />
            </p:column>

            <p:column headerText="Examen de Laboratorio">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{ex.examen}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{ex.examen}" style="width:100%" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Indicaciones">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{ex.indicaciones}" />
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{ex.indicaciones}" style="width:100%" />
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Editar" width="60" style="text-align:center;">
                <p:rowEditor />
            </p:column>

            <p:column headerText="Eliminar" width="70" style="text-align:center;">
                <p:commandButton icon="ui-icon-trash"
                                 styleClass="ui-button-danger ui-button-flat"
                                 title="Eliminar"
                                 process="@this"
                                 update="tablaExamen"
                                 action="#{examenLaboratorioBean.eliminarExamen(ex)}" />
            </p:column>

        </p:dataTable>

    </h:form>
</p:fieldset>

<!-- ===== BOTONES ===== -->
<h:form styleClass="examen-botones">
    <p:commandButton value="Registrar Examen"
                     icon="pi pi-save"
                     action="#{examenLaboratorioBean.registrarExamen}" />
    <p:commandButton value="Salir de Atención"
                     icon="pi pi-sign-out"
                     type="button"
                     styleClass="p-button-secondary" />
</h:form>

</ui:composition>
